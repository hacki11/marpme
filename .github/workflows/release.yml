name: Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  binaries:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            artifact: marpme-linux-x86_64
            built: dist/marpme
          - os: windows-latest
            artifact: marpme-windows-x86_64.exe
            built: dist/marpme.exe
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Set package version from release tag
        shell: bash
        run: uv version --frozen "${GITHUB_REF_NAME#v}"
      - run: uv sync --all-groups
      - run: uv run pytest
      - run: uv run pyinstaller packaging/pyinstaller/marpme.spec
      - name: Verify executable version
        shell: bash
        run: |
          expected="marpme ${GITHUB_REF_NAME#v}"
          actual="$("${{ matrix.built }}" --version)"
          if [[ "$actual" != "$expected" ]]; then
            printf 'Version mismatch: expected %s, got %s\n' "$expected" "$actual" >&2
            exit 1
          fi
      - shell: bash
        run: mv "${{ matrix.built }}" "${{ matrix.artifact }}"
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}

  publish-release:
    needs: binaries
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: marpme-*
          path: release
          merge-multiple: true
      - name: Build checksums and release manifest
        shell: bash
        run: |
          version="${GITHUB_REF_NAME#v}"
          base_url="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
          cd release
          sha256sum marpme-linux-x86_64 marpme-windows-x86_64.exe > SHA256SUMS
          linux_sha=$(sha256sum marpme-linux-x86_64 | awk '{print $1}')
          windows_sha=$(sha256sum marpme-windows-x86_64.exe | awk '{print $1}')
          printf '{\n  "version": "%s",\n  "artifacts": {\n' "$version" > latest.json
          printf '    "linux-x86_64": {"url": "%s/marpme-linux-x86_64", "sha256": "%s"},\n' "$base_url" "$linux_sha" >> latest.json
          printf '    "windows-x86_64": {"url": "%s/marpme-windows-x86_64.exe", "sha256": "%s"}\n' "$base_url" "$windows_sha" >> latest.json
          printf '  }\n}\n' >> latest.json
          cp ../packaging/install.sh ../packaging/install.ps1 .
      - env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/* --generate-notes


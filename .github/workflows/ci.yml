name: CI
on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: uv sync --all-groups
      - run: uv run ruff check .
      - run: uv run pytest
      - run: uv run pyinstaller packaging/pyinstaller/marpme.spec
      - run: dist/marpme --version
        if: runner.os != 'Windows'
      - run: dist/marpme.exe --version
        if: runner.os == 'Windows'

